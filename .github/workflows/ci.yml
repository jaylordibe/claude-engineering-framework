name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The plugin ships Markdown, JSON and POSIX shell. There is nothing to compile
# and nothing to install, so CI is fast enough to run on every push and is
# expected to stay that way.
#
# Least privilege, repository-wide. No job here needs to write anything, and a
# workflow that ships governance to other people's repositories should not be
# the one asking for more scope than it uses.
permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, not a tag. A tag is a mutable
# pointer: `@v4` runs whatever its owner last moved it to, which is a change to
# this repository's CI that nobody here reviewed. The trailing comment records
# which release each SHA was, so the pin stays legible when it needs bumping.
jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The default leaves the job's token in .git/config for anything
          # later in the job to find. Nothing here talks to the remote after
          # checkout, and one step below installs a package from npm.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install jq
        # Both shipped scripts require jq: ef-doctor reads the repository's
        # settings with it, and ef-install-settings merges with it. Without jq
        # the doctor reports that it could not inspect and the installer
        # refuses to write, so every case below would assert against a refusal
        # rather than against real behaviour.
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq

      - name: Shell syntax
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "OK    $script"
            else
              echo "FAIL  $script"
              status=1
            fi
          done < <(find plugins -type f \( -name '*.sh' -o -path '*/bin/*' \))
          exit "$status"

      - name: ShellCheck
        run: |
          sudo apt-get install --yes shellcheck
          find plugins -type f \( -name '*.sh' -o -path '*/bin/*' \) -print0 |
            xargs -0 shellcheck --severity=warning --external-sources

      - name: Static plugin validation
        run: node tests/validate-plugin.mjs --strict

      - name: Fixture corpus validation
        # The graders' automatic-failure conditions are only meaningful if the
        # fixtures really are as disjoint — and as hostile — as they claim.
        # This is what enforces that, and it is cheap.
        run: node tests/validate-fixtures.mjs

      - name: Session charter budget and guarantees
        run: node tests/validate-charter.mjs

      - name: Repository contract audit against fixtures
        # ef-doctor must behave correctly on repositories that satisfy the
        # contract to different degrees, including one that satisfies almost
        # none of it. A doctor that only works on a healthy repository is not a
        # doctor — and one whose exit code nobody asserts is not a check.
        run: node tests/run-doctor-fixtures.mjs

      - name: Project settings merge
        # ef-install-settings is the only component that writes to a file a
        # consuming repository owns. Every failure mode it has is silent from
        # here and expensive there: a dropped permission rule, a destroyed
        # unparseable file, a silently repointed marketplace.
        run: node tests/validate-install-settings.mjs

  official-validator:
    name: claude plugin validate
    runs-on: ubuntu-latest
    # Runs against whatever Claude Code version is current, so a schema change
    # upstream surfaces here rather than in a user's session. Non-blocking on
    # purpose: an upstream change should tell us, not stop the repository.
    continue-on-error: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Claude Code
        # Deliberately unpinned. The whole point of this job is to run against
        # whatever version users are actually on, so pinning it would test a
        # version nobody has. It runs with a read-only token, in a job whose
        # result cannot fail the build, and touches nothing outside the runner.
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate ./plugins/engineering-framework --strict

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict
